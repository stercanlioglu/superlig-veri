name: ApiFootball test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python af_test.py
        env:
          APIFOOTBALL_TOKEN: ${{ secrets.APIFOOTBALL_TOKEN }}
