name: Süper Lig veri

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pandas numpy
      - run: python cek.py
      - name: FotMob istatistikleri (engellenirse atlanır)
        continue-on-error: true
        run: python fotmob.py
      - name: Nesine oranları (engellenirse atlanır)
        continue-on-error: true
        run: python nesine.py
      - name: Livesport maç önizlemeleri / eksik oyuncular (engellenirse atlanır)
        continue-on-error: true
        run: python livesport.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "veri güncellendi $(date -u +%F)"
          # gönderme: araya başka bir kayıt girdiyse üstüne al, geçici hata olursa yeniden dene
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
            echo "::warning::kaydetme denemesi $i başarısız, yeniden denenecek"; sleep $((i * 15))
          done
          [ "$ok" = 1 ] || { echo "::error::Değişiklikler depoya gönderilemedi (3 deneme)"; exit 1; }
