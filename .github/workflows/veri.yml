
name: Süper Lig veri

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/cek.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "veri güncellendi $(date -u +%F)"
          git push
