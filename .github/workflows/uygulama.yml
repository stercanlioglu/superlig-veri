name: Uygulama güncelle

# Gece veri çekme işi bitince modeli yeniden kurar, index.html'i yeniden şifreler.
on:
  workflow_run:
    workflows: ["Süper Lig veri"]
    types: [completed]
  workflow_dispatch:
  push:                 # elle tetikleme: tetik.txt değiştirilip push edilince
    branches: [main]
    paths: [tetik.txt]

permissions:
  contents: write

concurrency:
  group: uygulama
  cancel-in-progress: false

jobs:
  guncelle:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.2.6 pandas==2.3.3 scipy==1.15.3 cryptography==50.0.2
      - name: Modeli kur ve sayfayı şifrele
        env:
          SL_KULLANICI: ${{ secrets.SL_KULLANICI }}
          SL_SIFRE: ${{ secrets.SL_SIFRE }}
        run: |
          # secret var mı (değer yazdırılmaz); hata olursa son satırlar herkese açık uyarı notu olarak görünür
          [ -n "$SL_KULLANICI" ] && echo "SL_KULLANICI tanımlı" || echo "::error::SL_KULLANICI secret'ı boş veya tanımsız"
          [ -n "$SL_SIFRE" ] && echo "SL_SIFRE tanımlı" || echo "::error::SL_SIFRE secret'ı boş veya tanımsız"
          set -o pipefail
          python motor/guncelle.py 2>&1 | tee cikti.log || { echo "::error::$(tail -c 900 cikti.log | tr '\n' ' ')"; exit 1; }
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "veri-bot"
          git config user.email "veri-bot@users.noreply.github.com"
          git add index.html data/model
          git diff --cached --quiet || git commit -m "uygulama güncellendi $(date -u +%F)"
          git push
